apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      annotations:
#        vault.hashicorp.com/agent-inject: "true"
#        vault.hashicorp.com/role: "gaiax-edc_role"
#        vault.hashicorp.com/agent-inject-secret-config.txt: "{{ .Values.vaultEnvIdentifier }}/{{ .Release.Namespace }}-xfsc-advsearch-be"
#        vault.hashicorp.com/agent-inject-template-config.txt: |
#          {{`{{ with secret "`}}{{ .Values.vaultEnvIdentifier }}/{{ .Release.Namespace }}{{`-xfsc-advsearch-be" }}
#          {{ range $k, $v := .Data.data }}
#            export {{ $k }}={{ $v }}
#          {{ end }}
#          {{ end }}`}}
      labels:
        app: {{ .Release.Name }}
    spec:
      # fixing fortify issue 'Kubernetes Misconfiguration: Service Account Token Automounted'
      automountServiceAccountToken: false
      
      # fixing fortify issue 'Kubernetes Misconfiguration: Improper Deployment Access Control'
      securityContext:
        seccompProfile:
          type: RuntimeDefault
          
      serviceAccountName: {{ if .Values.serviceAccount }}{{ .Values.serviceAccount.name | default .Release.Name }}{{ else }}{{ .Release.Name }}{{ end }}
      
      volumes:
        - name: data-storage
          persistentVolumeClaim:
            claimName: {{ .Values.schemaVolumeClaim }}
        - name: {{ .Release.Name }}-configmap
          configMap:
            name: {{ .Release.Name }}-configmap
      
      containers:
        - name: {{ .Chart.Name }}-be
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          ports:
            - containerPort: {{ .Values.containerPort }}
          
          volumeMounts:
            - name: data-storage
              mountPath: {{ .Values.schemaPvcMountPath }}
            - name: {{ .Release.Name }}-configmap
              mountPath: /config
                  
          env:
            - name: AUTHENTICATION_PROVIDER_SERVICE_URL
              value: {{ .Values.authenticationProvider.service.url | quote }}

            - name: CATALOGUE_ADAPTER_TIER2_GATEWAY_URL
              value: {{ .Values.catalogueAdapter.tier2Gateway.url | quote }}
            - name: CATALOGUE_ADAPTER_TIER2_GATEWAY_PATH_PREFIX
              value: {{ .Values.catalogueAdapter.tier2Gateway.pathPrefix | quote }}

            - name: FEDERATED_CATALOGUE_TIER2_GATEWAY_URL
              value: {{ .Values.federatedCatalogue.tier2Gateway.url | quote }}
            - name: FEDERATED_CATALOGUE_TIER2_GATEWAY_PATH_PREFIX
              value: {{ .Values.federatedCatalogue.tier2Gateway.pathPrefix | quote }}
            
            - name: LOGGING_CONFIG
              value: {{ .Values.log4j.config | quote }}
            
            - name: OPENAPI_CONFIG_SERVERS
              value: {{ .Values.openapiConfig.servers | quote }}

            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.openTelemetry.otlpExporter.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .Values.openTelemetry.otlpExporter.protocol | quote }}
            - name: OTEL_PROPAGATORS
              value: {{ .Values.openTelemetry.propagators | quote }}
            - name: OTEL_RESOURCE_ATTRIBUTES_DEPLOYMENT_ENVIRONMENT
              value: {{ .Values.openTelemetry.environment | quote }}
            - name: OTEL_SDK_DISABLED
              value: {{ .Values.openTelemetry.disabled | quote }}

            - name: WEB_MVC_CORS_ALLOWED_ORIGINS
              value: {{ .Values.web.mvc.cors.allowedOrigins | quote }}
            - name: WEB_MVC_BEARER_TOKEN_REQUIRED
              value: {{ .Values.web.mvc.bearerToken.required | quote }}
            - name: WEB_MVC_BEARER_TOKEN_ALLOWED_PATHS
              value: {{ .Values.web.mvc.bearerToken.allowedPaths | quote }}
              
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.containerPort }}
              httpHeaders:
                - name: Accept
                  value: application/json
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.containerPort }}
              httpHeaders:
                - name: Accept
                  value: application/json
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

