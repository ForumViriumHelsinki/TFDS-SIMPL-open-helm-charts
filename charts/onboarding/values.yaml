# ------------------------------------------------------------------------------
# Kafka configuration
# ------------------------------------------------------------------------------
# Kafka is REQUIRED for full functionality (emails, domain events).
#
# There is no meaningful default configuration because:
# - Kafka service names are environment-specific
# - No internal convention exists (unlike database services)
#
# The placeholders below MUST be overridden in real deployments.
kafkaConfig:
  enabled: true
  spring:
    kafka:
      bootstrap-servers: "<REPLACE_WITH_KAFKA_BOOTSTRAP_SERVERS>"
      producer:
        properties:
          security.protocol: "<REPLACE_WITH_SECURITY_PROTOCOL>"
          sasl.mechanism: "<REPLACE_WITH_SASL_MECHANISM>"
          sasl.jaas.config: "<REPLACE_WITH_JAAS_CONFIG>"
      admin:
        auto-create: true
  simpl:
    kafka:
      topic:
        prefix: "<REPLACE_WITH_TOPIC_PREFIX>"

# ------------------------------------------------------------------------------
# Additional Spring configuration imports
# ------------------------------------------------------------------------------
# Path of additional configuration files to be imported by Spring.
extraConfigImport: /config/kafka.yml

# ------------------------------------------------------------------------------
# Development settings
# ------------------------------------------------------------------------------
# Enables development-specific behavior (e.g. local logging configuration).
# Should be set to false in production environments.
devMode: false
