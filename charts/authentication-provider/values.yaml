kafkaConfig: {}

#vaultConfig:
#  vault:
#    uri: [VAULT_URI]
#    secretEngine: location
#    basePath: authenticationprovider
#    authentication:
#      path: approle
#      roleId: [ROLE_ID]
#      secretId: [SECRET_ID]
vaultConfig: {}

appConfig:
  spring:
    profiles:
      active: # authority / participant
    config:
      import:
        - /config/kafka.yml
        - /config/vault.yml
    datasource:
      url: "jdbc:postgresql://postgresql.{{ .Release.Namespace }}.svc.cluster.local:5432/authenticationprovider"
      username: "authenticationprovider"
      password: "authenticationprovider"
    data:
      redis:
        host: "redis-master.{{ .Release.Namespace }}.svc.cluster.local"
        port: 6379
        username: "default"
        password: "admin"

  security:
    secret:
      location: database # database / vault

  simpl:
    certificate:
      san: <your-t2-fqdn>

  microservice:
    identity-provider:
      url: http://identity-provider.{{ .Release.Namespace }}.svc.cluster.local:8080
    security-attributes-provider:
      url: http://security-attributes-provider.{{ .Release.Namespace }}.svc.cluster.local:8080

  client:
    authority:
      url: "" # T2 url of the authority

  keypair:
    signature-algorithm: "SHA256withECDSA"
    algorithm: "ECDSA"
    key-length: 256
    read-algorithm: "EC"

  management:
    tracing:
      sampling:
        probability: [MANAGEMENT_TRACING_SAMPLING_PROBABILITY]
    otlp:
      tracing:
        endpoint: [MANAGEMENT_OTLP_TRACING_ENDPOINT]



podAnnotations:
  vault.security.banzaicloud.io/vault-addr: "https://secrets.placeholder"
  vault.security.banzaicloud.io/vault-role: "placeholder-role"
  vault.security.banzaicloud.io/vault-path: kubernetes
  vault.security.banzaicloud.io/vault-skip-verify: "true"
