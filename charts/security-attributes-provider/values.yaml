replicaCount: 1
image:
  repository: code.europa.eu:4567/simpl/simpl-open/development/iaa/security-attributes-provider
  pullPolicy: Always
  tag: 2.12.4
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsUser: 1001
  runAsGroup: 2000
  fsGroup: 2000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1001


service:
  type: ClusterIP
  port: 8080


resources: 
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 1Gi

livenessProbe:
  httpGet:
    path: "/actuator/health/liveness"
    port: http
  initialDelaySeconds: 120
  periodSeconds: 5
  failureThreshold: 10
readinessProbe:
  httpGet:
    path: "/actuator/health/readiness"
    port: http
  initialDelaySeconds: 120
  periodSeconds: 5
  failureThreshold: 10

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes:
  - name: spring-config
    configMap:
      name: security-attributes-provider-configmap

# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts:
  - name: spring-config
    mountPath: /config/

envFrom: []

nodeSelector: {}

tolerations: []

affinity: {}

env: []

appConfig:
  spring:
    data:
      redis:
        host: redis-master.{{ .Release.Namespace }}.svc.cluster.local
        port: 6379
        username: default
        password: admin

    datasource:
      url: jdbc:postgresql://postgresql.{{ .Release.Namespace }}.svc.cluster.local:5432/securityattributesprovider
      username: securityattributesprovider
      password: securityattributesprovider

  microservice:
    identity-provider:
      url: http://identity-provider.{{ .Release.Namespace }}.svc.cluster.local:8080
    authentication-provider:
      url: http://authentication-provider.{{ .Release.Namespace }}.svc.cluster.local:8080

  database-seeding:
    security-attribute-provider-mapping:
      enabled: true
      file-path: "classpath:db.seeding/identityAttributes.default.json"

  simpl:
    ephemeral-proof:
      issuer-url: [SIMPL_EPHEMERAL_PROOF_ISSUER_URL]
      expire-after: 3m
      proof-of-possession:
        signature-algorithm: ECDSA
        expiration-window:
          amount: 1
          chrono-unit: minutes

  management:
    tracing:
      sampling:
        probability: [MANAGEMENT_TRACING_SAMPLING_PROBABILITY]
    otlp:
      tracing:
        endpoint: [MANAGEMENT_OTLP_TRACING_ENDPOINT]


podAnnotations:
  vault.security.banzaicloud.io/vault-addr: "https://secrets.{{ .Values.config.app.namespaceTag | default .Values.namespaceTag.authority | default .Release.Namespace }}.{{ .Values.config.app.domainSuffix | default .Values.domainSuffix }}"
  vault.security.banzaicloud.io/vault-role: {{ .Values.secrets.role | default "authority-role" }}
  vault.security.banzaicloud.io/vault-path: kubernetes
  vault.security.banzaicloud.io/vault-skip-verify: "true"
