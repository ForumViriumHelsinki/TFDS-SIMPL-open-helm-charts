{{ if and .Values.ejbca.keystore.base64 .Values.ejbca.truststore.base64 }}
apiVersion: v1
kind: Secret
metadata:
  name: ejbca-rest-api-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  client-cert: {{ .Values.ejbca.keystore.base64 }}
  ca-truststore:  {{ .Values.ejbca.truststore.base64 }}
{{ end }}