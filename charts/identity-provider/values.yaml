replicaCount: 1
image:
  repository: ${CI_REGISTRY_IMAGE}
  pullPolicy: Always
  tag: 2.11.4
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsUser: 1001
  runAsGroup: 2000
  fsGroup: 2000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1001


service:
  type: ClusterIP
  port: 8080


resources: 
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 1Gi

livenessProbe:
  httpGet:
    path: "/actuator/health/liveness"
    port: http
  initialDelaySeconds: 120
  periodSeconds: 5
  failureThreshold: 10
readinessProbe:
  httpGet:
    path: "/actuator/health/readiness"
    port: http
  initialDelaySeconds: 120
  periodSeconds: 5
  failureThreshold: 10

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes:
  - name: spring-config
    configMap:
      name: identity-provider-configmap
  - name: ejbca-rest-api-client-cert
    secret:
      secretName: ejbca-rest-api-secret
      items:
        - key: client-cert
          path: keystore.p12
  - name: ejbca-rest-api-truststore
    secret:
      secretName: ejbca-rest-api-secret
      items:
        - key: ca-truststore
          path: truststore.jks
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts:
  - name: spring-config
    mountPath: /config/
  - name: ejbca-rest-api-client-cert
    mountPath: "/etc/certs/keystore.p12"
    subPath: "keystore.p12"
    readOnly: true
  - name: ejbca-rest-api-truststore
    mountPath: "/etc/certs/truststore.jks"
    subPath: "truststore.jks"
    readOnly: true

envFrom: []
nodeSelector: {}

tolerations: []

affinity: {}

ejbca:
  keystore: {}
    # manually specify keystore content, otherwise the corresponding secret will be created by ejbca init container
    #base64 : "yourbase64encodedkeystore"
  truststore: {}
    # manually specify truststore content, otherwise the corresponding secret will be created by ejbca init container
    #    base64: "yourbase64encodedtruststore"

appConfig:
  spring:
    datasource:
      url: jdbc:postgresql://postgresql.{{ .Release.Namespace }}.svc.cluster.local:5432/identityprovider
      username: identityprovider
      password: identityprovider
    ssl:
      bundle:
        jks:
          ejbca:
            key:
              alias: "superadmin"
            keystore:
              location: "file:/etc/certs/keystore.p12"
              password: "[EJBCA_KEYSTORE_PASSWORD]"
              type: "PKCS12"
            truststore:
              location: "file:/etc/certs/truststore.jks"
              password: "[EJBCA_TRUSTSTORE_PASSWORD]"
              type: "JKS"
    jpa:
      properties:
        hibernate:
          format_sql: true

  microservice:
    security-attributes-provider:
      url: "http://security-attributes-provider.{{ .Release.Namespace }}.svc.cluster.local:8080"

  ejbca:
    url: "https://ejbca-community-helm.{{ .Release.Namespace }}.svc.cluster.local:30443"
    profile-name: "Onboarding TLS Profile"
    end-entity-name: "Onboarding End Entity"
    ca-name: "OnBoardingCA"

  simpl:
    authority-participant-type-placeholder: GOVERNANCE_AUTHORITY

  management:
    otlp:
      tracing:
        endpoint: [MANAGEMENT_OTLP_TRACING_ENDPOINT]

