{{- if eq .Values.namespaceTag .Values.mainNamespace }}
apiVersion: beat.k8s.elastic.co/v1beta1
kind: Beat
metadata:
  name: heartbeat
  namespace: {{.Release.Namespace}} 
spec:
  type: heartbeat
  serviceAccountName: heartbeat-account  
  version: {{ .Values.elasticVersion }}
  elasticsearchRef:
    name: {{ .Release.Name }}-elasticsearch
  config:
    heartbeat.monitors:
    - type: http
      schedule: '0 * * * * * *'
      id: apm-server-apm-http-{{ .Values.namespaceTag }}
      name: apm-server-apm-http-{{ .Values.namespaceTag }}
      hosts: ["https://apm-server-apm-http.{{ .Values.namespaceTag }}.svc:8200"]
      ssl:
        verification_mode: none
    - type: http
      schedule: '1 * * * * * *'
      id: elastic-elasticsearch-es-http-internal-{{ .Values.namespaceTag }}
      name: elastic-elasticsearch-es-http-internal-{{ .Values.namespaceTag }}
      hosts: ["https://elastic-elasticsearch-es-http.{{ .Values.namespaceTag }}.svc:9200"]
      check.response.status: [401]
      ssl:
        verification_mode: none
    - type: tcp
      schedule: '2 * * * * * *'
      id: logstash-beats-ls-beats-0-{{ .Values.namespaceTag }}
      name: logstash-beats-ls-beats-0-{{ .Values.namespaceTag }}
      hosts: ["tcp://logstash-beats-ls-beats-0.{{ .Values.namespaceTag }}.svc:5044"]
    - type: tcp
      schedule: '3 * * * * * *'
      id: otel-collector-{{ .Values.namespaceTag }}
      name: otel-collector-{{ .Values.namespaceTag }}
      hosts: ["tcp://otel-collector.{{ .Values.namespaceTag }}.svc:4318"]
    - type: http
      schedule: '4 * * * * * *'
      id: elastic-elasticsearch-es-http-public-{{ .Values.namespaceTag }}
      name: elastic-elasticsearch-es-http-public-{{ .Values.namespaceTag }}
      hosts: ["https://elasticsearch.{{ .Values.namespaceTag }}.{{ .Values.domainSuffix }}/"]
      check.response.status: [401]
    - type: http
      schedule: '5 * * * * * *'
      id: kibana-{{ .Values.namespaceTag }}
      name: kibana-{{ .Values.namespaceTag }}
      hosts: ["https://kibana.{{ .Values.namespaceTag }}.{{ .Values.domainSuffix }}/"]
    - type: http
      schedule: '6 * * * * * *'
      id: mailpit-{{ .Values.namespaceTag }}
      name: mailpit-{{ .Values.namespaceTag }}
      hosts: ["https://mailpit.{{ .Values.namespaceTag }}.{{ .Values.domainSuffix }}/"]
      check.response.status: [401]
    - type: http
      schedule: '7 * * * * * *'
      id: pgadmin-{{ .Values.namespaceTag }}
      name: pgadmin-{{ .Values.namespaceTag }}
      hosts: ["https://pgadmin.{{ .Values.namespaceTag }}.{{ .Values.domainSuffix }}/"]
    - type: http
      schedule: '9 * * * * * *'
      id: redpanda-{{ .Values.namespaceTag }}
      name: redpanda-{{ .Values.namespaceTag }}
      hosts: ["https://redpanda.{{ .Values.namespaceTag }}.{{ .Values.domainSuffix }}/"]
      check.response.status: [401]
    setup.ilm.enabled: true
    setup.ilm.policy_name: heartbeat-ilm
    setup.ilm.overwrite: true
    setup.ilm.policy_file: "/usr/share/heartbeat/ilm/heartbeat-ilm.json"
    processors:
    - add_kubernetes_metadata: {}
    - add_cloud_metadata: {}
    - add_host_metadata: {}
    - add_fields:
        target: fields
        fields:
          namespace: {{ .Values.namespaceTag }}
  deployment:
    replicas: 1
    podTemplate:
      spec:
        securityContext:
          runAsUser: 0
        containers:
        - name: heartbeat
          {{- with .Values.heartbeat.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
          - mountPath: /usr/share/heartbeat/ilm/heartbeat-ilm.json
            name:  heartbeat-ilm-vol
            subPath: heartbeat-ilm.json
        volumes:
        - name: heartbeat-ilm-vol
          configMap:
            name: heartbeat-ilm-configmap
            defaultMode: 511
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: heartbeat-ilm-configmap
data: 
  heartbeat-ilm.json: |
    {
      "policy": {
        "phases": {
        {{- if eq .Values.deploy_minimal_stack true }}
          "hot": {
            "actions": {
              "rollover": {
                "max_age": "{{ .Values.heartbeat.minimal_stack_ilm.hot.max_age }}",
                "max_primary_shard_size": "{{ .Values.heartbeat.minimal_stack_ilm.hot.max_primary_shard_size }}"
              },
              "set_priority": {
                "priority": 100
              }
            },
            "min_age": "0ms"
          },
          "delete": {
            "min_age":  "{{ .Values.heartbeat.minimal_stack_ilm.delete.min_age }}",
            "actions": {
              "delete": {}
            }
          }
        }
        {{- else }}
          "hot": {
            "actions": {
              "rollover": {
                "max_age": "{{ .Values.heartbeat.ilm.hot.max_age }}",
                "max_primary_shard_size": "{{ .Values.heartbeat.ilm.hot.max_primary_shard_size }}"
              },
              "set_priority": {
                "priority": 100
              }
            },
            "min_age": "0ms"
          },
          "delete": {
            "min_age":  "{{ .Values.heartbeat.ilm.delete.min_age }}",
            "actions": {
              "delete": {}
            }
          }
        }
        {{- end }}
      }
    }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: heartbeat-role-{{ .Release.Namespace }}
rules:
- apiGroups: [""] 
  resources:
  - namespaces
  - pods
  - nodes
  verbs:
  - get
  - watch
  - list
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: heartbeat-account
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: heartbeat-rolebinding-{{ .Release.Namespace }}
subjects:
- kind: ServiceAccount
  name: heartbeat-account
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: heartbeat-role-{{ .Release.Namespace }}
  apiGroup: rbac.authorization.k8s.io
---

{{- end }}
