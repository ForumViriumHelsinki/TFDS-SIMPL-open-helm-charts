apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: {{ .Chart.Name }}
    image-tag: {{ .Values.deployment.image.tag }}
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.deployment.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        deployment: {{ .Release.Name }}
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: {{ .Values.deployment.vault.hashicorp.role }}
        {{- if and (hasKey .Values.deployment.vault "hashicorp") (hasKey .Values.deployment.vault.hashicorp "service") }}
        vault.hashicorp.com/service: {{ .Values.deployment.vault.hashicorp.service }}
        {{- end }}
        vault.hashicorp.com/agent-inject-secret-config.txt: "{{ tpl .Values.deployment.vault.hashicorp.secretConfigPath . }}"
        vault.hashicorp.com/agent-inject-template-config.txt: |
          {{- $secretPath := tpl .Values.deployment.vault.hashicorp.secretConfigPath . -}}
          {{- $template := printf (printf "{{`{{ with secret \"%s\" }}\n" $secretPath) -}}
          {{- $template = printf "%s{{ range $k, $v := .Data.data }}\n" $template -}}
          {{- $template = printf "%s  export {{ $k }}={{ $v }}\n" $template -}}
          {{- $template = printf "%s{{ end }}\n" $template -}}
          {{- $template = printf "%s{{ end }}`}}" $template -}}
          {{- tpl $template . | nindent 10 }}
    spec:
      automountServiceAccountToken: true
      serviceAccountName: {{ .Chart.Name }}
      containers:
        - name: {{ .Release.Name }}
          image: "{{ .Values.deployment.image.artifact }}:{{ .Values.deployment.image.tag }}"
          envFrom:
            - configMapRef:
                name: {{ .Chart.Name }}-configmap
          command: [ "/bin/sh" ]
          args: [ "-c", "ls -l /otel && chmod 755 /otel/elastic-otel-javaagent.jar && . /vault/secrets/config.txt && java -javaagent:/otel/elastic-otel-javaagent.jar -jar /infrastructure-consumption-monitoring-service.jar" ]
          env:
            - name: OTEL_SERVICE_NAME
              value: {{ .Chart.Name }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.deployment.otel.endpoint }}
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            - name: OVH_PROJECT_ID
              value: {{ .Values.deployment.ovh.project_id }}
            - name: OVH_HOST
              value: {{ .Values.deployment.ovh.host }}
            - name: KAFKA_BOOTSTRAP_SERVER
              value: {{ .Values.deployment.kafka.bootstrapServer }}
            - name: KAFKA_CLIENT_USER
              value: {{ .Values.deployment.kafka.clientUser }}
            - name: KAFKA_RETRY_TOPIC_BACKOFF_DELAY
              value: {{ .Values.deployment.kafka.retryTopicBackoffDelay }}
            - name: KAFKA_SECURITY_PROTOCOL
              value: {{ .Values.deployment.kafka.securityProtocol }}
            - name: KAFKA_SASL_MECHANISM
              value: {{ .Values.deployment.kafka.sasl.mechanism }}
            - name: KAFKA_SASL_JAAS_CONFIG
              value: org.apache.kafka.common.security.plain.PlainLoginModule required username="{{ .Values.deployment.kafka.clientUser }}" password="${KAFKA_CLIENT_PASSWORDS}";
            - name: KAFKA_LISTENER_TIMEOUT
              value: {{ .Values.deployment.kafka.listener.timeout | quote }}
            - name: OVH_INITIAL_REPORT_OFFSET_IN_MONTHS
              value: {{ .Values.deployment.ovh.initialReportOffsetInMonths | quote }}
            - name: OVH_SCHEDULE
              value: {{ .Values.deployment.ovh.schedule }}
            - name: OVH_CURRENT_SCHEDULE
              value: {{ .Values.deployment.ovh.currentSchedule }}
            - name: MOCKED_PLUGIN_SCHEDULE
              value: {{ .Values.deployment.mockedPlugin.schedule }}
            - name: MOCKED_PLUGIN_TEST_FAIL_EVERY_X_MINUTES
              value: {{ .Values.deployment.mockedPlugin.testFailEveryXMinutes | quote }}
            - name: MOCKED_PLUGIN_RANDOM_FAILS_ENABLED
              value: {{ .Values.deployment.mockedPlugin.randomFailsEnabled | quote }}
            - name: FAILED_EVENTS_RETRY_SCHEDULE
              value: {{ .Values.deployment.failedEvents.retrySchedule }}
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -agentlib:jdwp=transport=dt_socket,address=9009,server=y,suspend=n
          resources:
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
          imagePullPolicy: {{ .Values.deployment.image.pullPolicy }}
          ports:
            - containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: {{ .Values.probe.endpoint }}
              scheme: {{ .Values.probe.scheme }}
              port: {{ .Values.probe.port }}
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: {{ .Values.probe.endpoint }}
              scheme: {{ .Values.probe.scheme }}
              port: {{ .Values.probe.port }}
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          startupProbe:
            failureThreshold: 60
            httpGet:
              path: {{ .Values.probe.endpoint }}
              scheme: {{ .Values.probe.scheme }}
              port: {{ .Values.probe.port }}
            periodSeconds: 10
